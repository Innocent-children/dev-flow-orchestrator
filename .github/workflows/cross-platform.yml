name: Cross-platform validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reviewed_canonical:
        description: Exact reviewed dev-flow-canonical-v1 SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEV_FLOW_REVIEWED_CANONICAL: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_canonical || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            python: "3.9"
          - os: Linux
            runner: ubuntu-latest
            python: "3.10"
          - os: Linux
            runner: ubuntu-latest
            python: "3.11"
          - os: Linux
            runner: ubuntu-latest
            python: "3.12"
          - os: Linux
            runner: ubuntu-latest
            python: "3.13"
          - os: Linux
            runner: ubuntu-latest
            python: "3.14"
          - os: macOS
            runner: macos-latest
            python: "3.9"
          - os: macOS
            runner: macos-latest
            python: "3.14"
          - os: Windows
            runner: windows-latest
            python: "3.9"
          - os: Windows
            runner: windows-latest
            python: "3.14"

    steps:
      - name: Check out the exact candidate snapshot
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the official validator runtime dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Materialize pinned official Codex validator sources
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CODEX_VALIDATOR_COMMIT: f61b51ddd924643514b33234816a8a2772b1aec7
          CODEX_SKILL_VALIDATOR_BLOB: 0547b4041a5f58fa19892079a114a1df98286406
          CODEX_SKILL_VALIDATOR_SHA256: 6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51
          CODEX_PLUGIN_VALIDATOR_BLOB: 88fae0fd00998ea32fa2393869042f0231a2b43b
          CODEX_PLUGIN_VALIDATOR_SHA256: ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const os = require("os");
            const path = require("path");

            const validators = [
              {
                environmentName: "DEV_FLOW_SKILL_VALIDATOR",
                repositoryPath:
                  "codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py",
                blob: process.env.CODEX_SKILL_VALIDATOR_BLOB,
                sha256: process.env.CODEX_SKILL_VALIDATOR_SHA256,
              },
              {
                environmentName: "DEV_FLOW_PLUGIN_VALIDATOR",
                repositoryPath:
                  "codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py",
                blob: process.env.CODEX_PLUGIN_VALIDATOR_BLOB,
                sha256: process.env.CODEX_PLUGIN_VALIDATOR_SHA256,
              },
            ];
            const outputRoot = path.join(
              process.env.RUNNER_TEMP,
              "dev-flow-codex-validators",
            );
            fs.mkdirSync(outputRoot, { recursive: true });
            for (const validator of validators) {
              const response = await github.rest.repos.getContent({
                owner: "openai",
                repo: "codex",
                path: validator.repositoryPath,
                ref: process.env.CODEX_VALIDATOR_COMMIT,
              });
              const source = response.data;
              if (
                Array.isArray(source) ||
                source.type !== "file" ||
                source.encoding !== "base64"
              ) {
                throw new Error(
                  `official validator is not a base64 file: ${validator.repositoryPath}`,
                );
              }
              if (source.sha !== validator.blob) {
                throw new Error(
                  `official validator blob mismatch for ${validator.repositoryPath}`,
                );
              }
              const contents = Buffer.from(
                source.content.replace(/\s/g, ""),
                "base64",
              );
              const actualSha256 = crypto
                .createHash("sha256")
                .update(contents)
                .digest("hex");
              if (actualSha256 !== validator.sha256) {
                throw new Error(
                  `official validator SHA-256 mismatch for ${validator.repositoryPath}`,
                );
              }
              const destination = path.join(
                outputRoot,
                path.basename(validator.repositoryPath),
              );
              fs.writeFileSync(destination, contents, { mode: 0o600 });
              fs.appendFileSync(
                process.env.GITHUB_ENV,
                `${validator.environmentName}=${destination}${os.EOL}`,
                { encoding: "utf8" },
              );
            }

      - name: Set up Node for pinned OpenSpec
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned OpenSpec validation CLI
        run: npm install --global @fission-ai/openspec@1.6.0

      - name: Report native diagnostics
        run: python -c "import platform,sys; print('os=' + platform.platform()); print('python=' + sys.version); print('executable=' + sys.executable)"

      - name: Report real Git version
        run: git --version

      - name: Assert the canonical-v1 normative golden vector
        run: python -c "from scripts.candidate_identity import assert_golden_vector; assert_golden_vector()"

      - name: Validate the reviewed release-candidate input
        if: github.event_name == 'workflow_dispatch'
        run: python -c "import os,re,sys; value=os.environ.get('DEV_FLOW_REVIEWED_CANONICAL',''); sys.exit(0 if re.fullmatch(r'[0-9a-f]{64}',value) else 2)"

      - name: Run the full unit suite
        run: python -m unittest discover -s tests -v

      - name: Audit standard-library-only runtime and isolated startup
        run: python scripts/audit_runtime_imports.py

      - name: Validate skills, manifest, default hooks, and package inventory
        run: python scripts/validate_package.py

      - name: Require official Codex-bundled validators on the exact candidate snapshot
        env:
          DEV_FLOW_EXPECTED_GIT_SHA: ${{ github.sha }}
          DEV_FLOW_EXPECTED_CANONICAL_SHA256: ${{ env.DEV_FLOW_REVIEWED_CANONICAL }}
        run: python scripts/run_bundled_validators.py --require-available

      - name: Strictly validate the OpenSpec change
        run: openspec validate complete-cross-platform-support --strict
