name: V4 focused validation

on:
  workflow_dispatch:
  pull_request:

jobs:
  focused-v4:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision pinned OpenSpec validator
        run: npm install --global @fission-ai/openspec@1.6.0
      - name: Greenfield architecture and package validators
        run: |
          python3 -I -S scripts/validate_greenfield_architecture.py
          python3 -I -S scripts/validate_package.py
          openspec validate --all --strict
      - name: Focused current V4 suites
        run: |
          python3 -m unittest \
            tests.test_greenfield_skeleton \
            tests.test_greenfield_core_workflow \
            tests.test_greenfield_conversation_authority \
            tests.test_greenfield_confirmation_races \
            tests.test_greenfield_effect_recovery \
            tests.test_greenfield_journal_fencing \
            tests.test_greenfield_recovery_integrity \
            tests.test_greenfield_multi_repository \
            tests.test_greenfield_adapters
