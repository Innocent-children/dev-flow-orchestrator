name: Focused validation

on:
  workflow_dispatch:
  pull_request:

jobs:
  repository-regression:
    name: Full repository regression (macOS, Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Candidate package validation
        run: uv run python scripts/validate_package.py
      - name: Full unittest discovery once
        run: uv run python -m unittest discover -s tests -p "test_*.py"

  installed-python-smoke:
    name: Wheel/import/STDIO smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Hash-locked wheel-only install, import, and MCP startup
        run: uv run python scripts/ci_release_smoke.py

  simulated-lifecycle-contract:
    name: Simulated lifecycle contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Artifact, state-machine, dispatcher, migration, and uninstall tests
        run: >-
          uv run python -m unittest
          tests.test_release_artifact
          tests.test_release_builder
          tests.test_artifact_managed_runtime
          tests.test_lifecycle_state
          tests.test_lifecycle_machine
          tests.test_release_lifecycle
          tests.test_release_resolver
          tests.test_release_commands
          tests.test_render_dispatchers
          tests.test_stable_dispatcher
          tests.test_install_script
          tests.test_legacy_migration
          tests.test_uninstall_driver
          tests.test_windows_lifecycle
          tests.test_windows_product_support
      - name: Evidence boundary
        run: >-
          uv run python -c
          "print('Simulated adapters and static scripts are not native final-artifact or real Codex evidence.')"
