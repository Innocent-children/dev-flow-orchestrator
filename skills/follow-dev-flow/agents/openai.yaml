interface:
  display_name: "执行开发流程"
  short_description: "在单个 Git 仓库中启动或继续 V5 受控开发流程"
  default_prompt: "使用 $follow-dev-flow 在当前单个 Git 仓库中启动或继续 V5 开发流程，并按控制器投影执行下一项动作。"
dependencies:
  tools:
    - type: "mcp"
      value: "codebase-memory-mcp"
      description: "Maintains explicit baseline and current-workspace projects and traces change impact"
policy:
  allow_implicit_invocation: true
