interface:
  display_name: "Review Dev Flow Change"
  short_description: "Review an exact 0.4.0 task-owned change slice"
  default_prompt: "Use $review-dev-flow-change to independently review the exact aggregate snapshot for a set of one to eight repositories and return one fingerprinted task-wide verdict."
dependencies:
  tools:
    - type: "mcp"
      value: "codebase-memory-mcp"
      description: "Uses per-member current-workspace projects for source-confirmed aggregate review discovery"
policy:
  allow_implicit_invocation: false
