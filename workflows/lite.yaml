schema: dev-flow-workflow/0.2.0
id: lite
version: "0.2.0"
description: "Fast personal delivery with implementation, bounded verification, and a Delivery Dossier."
entry: preflight
revision_target: implement

nodes:
  preflight:
    action_id: task.preflight
    handler: preflight
    target: {node: implement, status: IMPLEMENTING}
    effect: git.inspect-repository
    artifact:
      type: repository-baseline
      workspace: produces-source
      inputs: []

  implement:
    action_id: implementation.record
    handler: artifact.record
    target: {node: verify, status: VERIFYING}
    payload: {summary: string}
    artifact:
      type: implementation
      workspace: produces-source
      inputs: [{type: repository-baseline, edge: source-predecessor}]

  verify:
    action_id: verification.record
    handler: verification.record
    target: {node: finalize_success, status: FINALIZING}
    payload: {passed: boolean, command: string, coverage: object, summary: string}
    artifact:
      type: verification-result
      workspace: verifies-source
      inputs: [{type: implementation, edge: governing}]
    rework:
      failure: {node: verification_rework, status: IMPLEMENTING}
      max_attempts: 2
      exhausted: {node: finalize_verification_incomplete, status: FINALIZING}

  verification_rework:
    action_id: verification.rework.record
    handler: artifact.record
    target: {node: verify, status: VERIFYING}
    payload: {summary: string}
    artifact:
      type: implementation
      workspace: produces-source
      inputs:
        - {type: implementation, edge: source-predecessor}
        - {type: verification-result, edge: causal}

  finalize_success:
    action_id: delivery.finalize.success
    handler: delivery.finalize
    target: {node: done, status: DONE}
    payload: {summary: string, remaining_risks: object, handoff: string}
    artifact:
      type: delivery-dossier
      workspace: verifies-source
      inputs: [{type: verification-result, edge: governing}]
    finalize: success

  finalize_verification_incomplete:
    action_id: delivery.finalize.verification-incomplete
    handler: delivery.finalize
    target: {node: incomplete, status: INCOMPLETE}
    payload: {summary: string, remaining_risks: object, handoff: string}
    artifact:
      type: delivery-dossier
      workspace: verifies-source
      inputs: [{type: verification-result, edge: governing}]
    finalize: incomplete

  done: {terminal: true}
  incomplete: {terminal: true}
  cancelled: {terminal: true}

cancel:
  stages: [preflight, implement, verify, verification_rework]
  action_id: task.cancel
  handler: artifact.record
  target: {node: cancelled, status: CANCELLED}
  payload: {reason: string}
