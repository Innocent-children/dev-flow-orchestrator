schema: spec-driven

context: |
  Select the language for every new or updated human-readable OpenSpec artifact
  in this order: an explicit user choice for the current work; otherwise the
  dominant language of existing OpenSpec artifacts; otherwise the dominant
  language of the repository's other human-readable artifacts. If repository
  signals conflict or the result remains unclear, stop and ask before writing.
  Preserve exact machine-required identifiers, code symbols, paths, commands,
  JSON keys, schema names, enum values, and fixed template/parser keywords.

rules:
  proposal:
    - Write the title, background, goals, non-goals, impact, and risks consistently in the selected language.
  design:
    - Write decisions, alternatives, compatibility, migration, rollback, and risk prose consistently in the selected language.
  specs:
    - Write requirement and scenario prose in the selected language while retaining OpenSpec-required structural keywords exactly.
  tasks:
    - Write task descriptions, verification steps, and completion criteria consistently in the selected language.
